model:
  vocab_size: 49152
  d_model: 512
  n_layers: 8
  n_heads: 8
  n_kv_heads: 2
  d_ff: 1536
  max_seq_len: 1024
  rope_theta: 10000.0
  norm_eps: 1.0e-05
  tie_embeddings: true
  dropout: 0.0
  attention_backend: auto
  compile_attention: true
  use_fused_rmsnorm: true
  use_fused_swiglu: true
  use_fused_ce: false
  ce_chunk_size: 1024
  z_loss_coeff: 0.0
  gradient_checkpointing: false
  init_std: 0.02
data:
  dataset: tinystories
  data_dir: data/tinystories
  tokenizer: HuggingFaceTB/SmolLM-135M
  seq_len: 1024
  mode: pack_ffd
  schedule: balanced
  pad_batch_size: 8
  max_docs: 5000
  num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  val_fraction: 0.02
  seed: 42
  pad_token_id: 0
  eos_token_id: 0
  min_doc_len: 8
  max_doc_len: 1024
  synthetic_num_docs: 20000
  synthetic_mu: 5.5
  synthetic_sigma: 1.0
  synthetic_min_len: 16
  synthetic_max_len: 4096
  synthetic_vocab_size: 49152
  isoflop_iterations: 8
  drop_last: true
train:
  output_dir: artifacts/tinystories
  seed: 42
  max_steps: 1000
  grad_accum: 4
  lr: 0.0003
  min_lr: 3.0e-05
  warmup_steps: 100
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: bf16
  log_interval: 10
  eval_interval: 50
  eval_steps: 20
  save_interval: 500
  keep_last: 2
  resume: false
  fsdp: false
  compile: false
  profile: false
  profile_steps: 5
  profile_warmup: 2
  gpu_hourly_cost: 0.69
  peak_tflops: 0.0
  deterministic: false
  bucket_cap_mb: 25
  find_unused_parameters: false
